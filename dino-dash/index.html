<style>
  :root { box-sizing: border-box; color-scheme: dark; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; height: 100%; }
  body { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px)); background: radial-gradient(circle at 50% 30%, #3d5a80, #1f2b33 70%); font-family: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif; color: #1f2b33; -webkit-tap-highlight-color: transparent; }
  .card { width: 100%; max-width: 420px; text-align: center; background: #fffaf0; border: 5px solid #1f2b33; border-radius: 10px; box-shadow: 8px 8px 0 rgba(0,0,0,.45); padding: 28px 22px 24px; }
  .card.shake { animation: shake .45s; }
  @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  .lock { font-size: 54px; line-height: 1; }
  h1 { font-family: 'Lilita One', "Fredoka", sans-serif; font-weight: 400; font-size: 30px; line-height: 1.25; margin: 12px 0 8px; color: #ffb703; text-shadow: 3px 3px 0 #2f9e44, 6px 6px 0 #1f2b33; }
  p { font-size: 18px; margin: 0 0 16px; color: #5d6b72; }
  input { width: 100%; font: 700 22px "Fredoka", sans-serif; text-align: center; padding: 12px; border-radius: 8px; border: 4px solid #d9d2c0; background: #ffffff; color: #1f2b33; -webkit-user-select: text; user-select: text; }
  input:focus { outline: none; border-color: #ffb703; }
  button { margin-top: 16px; width: 100%; border: none; cursor: pointer; border-radius: 8px; padding: 16px; background: #2f9e44; color: #ffffff; font: 700 22px "Fredoka", sans-serif; box-shadow: 0 6px 0 #1f6e2f; }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #1f6e2f; }
  button:disabled { opacity: .7; }
  .msg { min-height: 26px; margin-top: 14px; font-weight: 700; font-size: 18px; color: #c2185b; }
</style>
</head>
