<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treetop Tumbler">
<meta name="theme-color" content="#1d1b3a">
<title>Treetop Tumbler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { box-sizing: border-box; color-scheme: dark; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100%; display: flex; align-items: center; justify-content: center;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px));
    background: radial-gradient(circle at 50% 30%, #2a2466, #1d1b3a 70%);
    font-family: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif; color: #24323a;
    -webkit-tap-highlight-color: transparent;
  }
  .card {
    width: 100%; max-width: 420px; text-align: center; background: #fffdf6;
    border: 5px solid #24323a; border-radius: 10px; box-shadow: 8px 8px 0 rgba(0,0,0,.45); padding: 28px 22px 24px;
  }
  .card.shake { animation: shake .45s; }
  @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  .lock { font-size: 54px; line-height: 1; }
  h1 { font-family: 'Press Start 2P', "Fredoka", sans-serif; font-weight: 400; font-size: 30px; line-height: 1.25; margin: 12px 0 8px; color: #ffc93c; text-shadow: 3px 3px 0 #e83e8c, 6px 6px 0 #24323a; }
  p { font-size: 18px; margin: 0 0 16px; color: #5d6b72; }
  input {
    width: 100%; font: 700 22px "Fredoka", sans-serif; text-align: center; padding: 12px; border-radius: 8px;
    border: 4px solid #d9d2c0; background: #ffffff; color: #24323a; -webkit-user-select: text; user-select: text;
  }
  input:focus { outline: none; border-color: #ffc93c; }
  button {
    margin-top: 16px; width: 100%; border: none; cursor: pointer; border-radius: 8px; padding: 16px;
    background: #e83e8c; color: #ffffff; font: 700 22px "Fredoka", sans-serif; box-shadow: 0 6px 0 #9c1f5c;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #9c1f5c; }
  button:disabled { opacity: .7; }
  .msg { min-height: 26px; margin-top: 14px; font-weight: 700; font-size: 18px; color: #c2185b; }
  noscript { display: block; margin-top: 12px; }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="lock" id="icon">🔒</div>
  <h1>TREETOP<br>TUMBLER</h1>
  <p>This game is locked. Type the secret password to play.</p>
  <form id="form" autocomplete="off">
    <input id="pw" type="password" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Secret password" aria-label="Secret password">
    <button id="go" type="submit">Unlock 🌳</button>
  </form>
  <div class="msg" id="msg" role="status"></div>
  <noscript>This game needs JavaScript turned on.</noscript>
</main>

  function bytes(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
