<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dino Dash">
<meta name="theme-color" content="#1f2b33">
<title>Dino Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { box-sizing: border-box; color-scheme: dark; }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100%; display: flex; align-items: center; justify-content: center;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px));
    background: radial-gradient(circle at 50% 30%, #3d5a80, #1f2b33 70%);
    font-family: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif; color: #1f2b33;
    -webkit-tap-highlight-color: transparent;
  }
  .card {
    width: 100%; max-width: 420px; text-align: center; background: #fffaf0;
    border: 5px solid #1f2b33; border-radius: 10px; box-shadow: 8px 8px 0 rgba(0,0,0,.45); padding: 28px 22px 24px;
  }
  .card.shake { animation: shake .45s; }
  @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
  .lock { font-size: 54px; line-height: 1; }
  h1 { font-family: 'Lilita One', "Fredoka", sans-serif; font-weight: 400; font-size: 30px; line-height: 1.25; margin: 12px 0 8px; color: #ffb703; text-shadow: 3px 3px 0 #2f9e44, 6px 6px 0 #1f2b33; }
  p { font-size: 18px; margin: 0 0 16px; color: #5d6b72; }
  input {
    width: 100%; font: 700 22px "Fredoka", sans-serif; text-align: center; padding: 12px; border-radius: 8px;
    border: 4px solid #d9d2c0; background: #ffffff; color: #1f2b33; -webkit-user-select: text; user-select: text;
  }
  input:focus { outline: none; border-color: #ffb703; }
  button {
    margin-top: 16px; width: 100%; border: none; cursor: pointer; border-radius: 8px; padding: 16px;
    background: #2f9e44; color: #ffffff; font: 700 22px "Fredoka", sans-serif; box-shadow: 0 6px 0 #1f6e2f;
  }
  button:active { transform: translateY(4px); box-shadow: 0 2px 0 #1f6e2f; }
  button:disabled { opacity: .7; }
  .msg { min-height: 26px; margin-top: 14px; font-weight: 700; font-size: 18px; color: #c2185b; }
  noscript { display: block; margin-top: 12px; }
</style>
</head>
<body>
<main class="card" id="card">

  <h1>DINO<br>DASH</h1>
  <p>This game is locked. Type the secret password to play.</p>

    <button id="go" type="submit">Unlock 🦖</button>
  </form>
  <div class="msg" id="msg" role="status"></div>
  <noscript>This game needs JavaScript turned on.</noscript>
</main>

      .then(function (base) { return crypto.subtle.deriveBits({ name: "PBKDF2", salt: bytes(SALT), iterations: ITER, hash: "SHA-256" }, base, 256); });
  }
  function openWith(raw) {
    return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"])
      .then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, k, bytes(DATA)); })
      .then(function (plain) { return new TextDecoder().decode(plain); });
  }
  function remember(raw) {
    try { var a = new Uint8Array(raw), s = ""; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); localStorage.setItem(STORE, btoa(s)); } catch (e) {}
  }
  var msg = document.getElementById("msg"), card = document.getElementById("card"), go = document.getElementById("go"), pw = document.getElementById("pw");
  if (!window.crypto || !crypto.subtle) { msg.textContent = "This browser can’t open locked games. Try Safari."; go.disabled = true; return; }
  // already unlocked on this device?
  var saved = null; try { saved = localStorage.getItem(STORE); } catch (e) {}
  if (saved) {
    document.getElementById("icon").textContent = "🔓"; msg.style.color = "#5d6b72"; msg.textContent = "Opening…";
    openWith(bytes(saved)).then(show).catch(function () { try { localStorage.removeItem(STORE); } catch (e) {} msg.textContent = ""; msg.style.color = ""; document.getElementById("icon").textContent = "🔒"; });
  }
  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var guess = pw.value.trim().toLowerCase().replace(/\s+/g, "-");
    if (!guess) { msg.textContent = "Type the password first!"; return; }
    go.disabled = true; msg.style.color = "#5d6b72"; msg.textContent = "Checking…";
    var raw;
    rawKey(guess).then(function (r) { raw = r; return openWith(r); })
      .then(function (html) { remember(raw); show(html); })
      .catch(function () {
        go.disabled = false; msg.style.color = ""; msg.textContent = "Not quite! Try again.";
        card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); pw.select();
      });
  });
})();
</script>
